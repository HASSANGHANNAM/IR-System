<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR-System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-shell">
        <header class="navbar">
            <div class="brand">IR-System</div>
            <nav class="nav-links">
                <button class="nav-link active" data-target="searchPage">Search</button>
                <button class="nav-link" data-target="evaluationPage">Evaluation</button>
            </nav>
        </header>

        <main class="page-wrapper">
            <section id="searchPage" class="page-section active">
                <div class="content-grid">
                    <aside class="left-panel">
                        <div class="panel-card">
                            <div class="panel-header">
                                <h2>Search Configuration</h2>
                            </div>
                            <div class="field-group">
                                <label for="dataset">Dataset</label>
                                <select id="dataset">
                                    <option value="beir/webis-touche2020">beir/webis-touche2020</option>
                                </select>
                            </div>
                            <div class="field-group input-with-clear">
                                <label for="query">Query</label>
                                <div class="query-row">
                                    <input id="query" type="text" placeholder="Enter search query...">
                                    <button id="clearQueryBtn" class="clear-btn" type="button">×</button>
                                </div>
                            </div>
                            <div class="field-group">
                                <label for="model">Model</label>
                                <select id="model">
                                    <option value="tfidf">TF-IDF</option>
                                    <option value="bm25">BM25</option>
                                    <option value="bert">BERT</option>
                                    <option value="hybrid">Hybrid</option>
                                </select>
                            </div>
                            <div class="field-group">
                                <label for="top_k">Top-K</label>
                                <input id="top_k" type="number" min="1" max="20" value="10">
                            </div>
                            <button id="searchBtn" class="primary-button" type="button">
                                <span class="search-icon">🔍</span>
                                Search
                            </button>
                        </div>

                        <div class="panel-card settings-card">
                            <div class="panel-header">
                                <h2>Settings</h2>
                            </div>
                            <div class="field-group checkbox-row">
                                <label class="checkbox-label">
                                    <input id="refineToggle" type="checkbox">
                                    Enable Query Refinement
                                </label>
                            </div>
                            <div class="field-group">
                                <label for="preprocessMethod">Preprocessing Method</label>
                                <select id="preprocessMethod">
                                    <option value="stemming">Stemming (Default)</option>
                                    <option value="lemmatization">Lemmatization</option>
                                </select>
                            </div>
                        </div>
                    </aside>

                    <section class="right-panel">
                        <div class="panel-card results-panel">
                            <div class="panel-header">
                                <h2>Search Results</h2>
                            </div>
                            <div id="resultsGrid" class="results-grid"></div>
                        </div>
                    </section>
                </div>
            </section>

            <section id="evaluationPage" class="page-section">
                <div class="panel-card overview-card">
                    <div class="panel-header">
                        <h2>Evaluation</h2>
                    </div>
                    <div class="summary-box">
                        <p>هذه الصفحة مخصصة لعرض مؤشرات التقييم والمعلومات الخاصة بنتائج البحث.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
